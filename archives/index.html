<!-- 暗色模式切换按钮 -->
<script>
(function() {
  'use strict';

  var DARK_KEY = 'blog-dark-mode';

  function isDark() {
    return document.documentElement.classList.contains('dark-mode');
  }

  function setDark(on) {
    var cls = document.documentElement.classList;
    if (on) { cls.add('dark-mode'); }
    else    { cls.remove('dark-mode'); }
    localStorage.setItem(DARK_KEY, on ? '1' : '0');
  }

  // 恢复已保存的状态
  if (localStorage.getItem(DARK_KEY) === '1') {
    setDark(true);
  }

  // 创建切换按钮 DOM
  function createToggleBtn(floating) {
    var btn = document.createElement('button');
    btn.className = floating ? 'dark-toggle-float' : 'dark-toggle';
    btn.title = '切换深色/浅色模式';
    btn.innerHTML = isDark() ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      var next = !isDark();
      setDark(next);
      btn.innerHTML = next ? '☀️' : '🌙';
      // 同步更新另一个按钮
      var others = document.querySelectorAll('.dark-toggle, .dark-toggle-float');
      others.forEach(function(b) {
        if (b !== btn) b.innerHTML = next ? '☀️' : '🌙';
      });
    });
    return btn;
  }

  // 桌面端：插入 sidebar
  function injectDesktopToggle() {
    var sidebar = document.querySelector('.links-of-author');
    if (!sidebar) return;
    var wrap = document.createElement('div');
    wrap.className = 'links-of-author-item';
    var btn = createToggleBtn(false);
    wrap.appendChild(btn);
    sidebar.parentNode.insertBefore(wrap, sidebar.nextSibling);
  }

  // 移动端：浮动按钮
  function injectMobileToggle() {
    var btn = createToggleBtn(true);
    document.body.appendChild(btn);
  }

  function isMobile() {
    return window.innerWidth <= 767;
  }

  document.addEventListener('DOMContentLoaded', function() {
    if (isMobile()) {
      injectMobileToggle();
    }
    injectDesktopToggle();
  });

  // 窗口尺寸变化时处理
  window.addEventListener('resize', function() {
    var floatBtn = document.querySelector('.dark-toggle-float');
    if (isMobile() && !floatBtn) {
      injectMobileToggle();
    }
  });
})();
</script>
